<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CUET PG Economics — COQP10</title>
    <script>
      // GitHub Pages SPA 404 fallback redirect
      (function() {
        var path = window.location.pathname;
        var query = window.location.search;
        var hash = window.location.hash;
        // Redirect back to base root
        var repoBase = path.split('/')[1] ? '/' + path.split('/')[1] + '/' : '/';
        window.location.replace(repoBase + (query || '') + (hash || ''));
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CUET PG Economics workspace...</p>
  </body>
</html>
